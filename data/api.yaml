apis:
  - name: hackatime
    type: oauth
    client_id: YOUR_UID
    client_secret: YOUR_SECRET
    endpoints:
      - heartbeats: /api/v1/my/heartbeats
      - stats: /api/v1/stats
  
  - name: nasa
    type: api_key
    url: https://api.nasa.gov
    key: YOUR_NASA_API_KEY
    endpoints:
      - apod: /planetary/apod              
      - mars_photos: /mars-photos/api/v1/rovers/curiosity/photos
      - neo: /neo/rest/v1/feed             
      - earth: /planetary/imagery            
